<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gemaakte afspraken &middot; Brightech</title>
<meta name="theme-color" content="#253151">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg:#eef0f3; --card:#fff; --primary:#253151; --primary-dark:#0F092F;
    --primary-light:#E0E4E9; --accent:#E87400; --accent-gold:#F4CB3C;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --radius:10px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  header {
    background:var(--primary); padding:18px 20px;
    display:flex; align-items:center; gap:14px;
  }
  header img { height:46px; width:auto; display:block; }
  header .htxt { color:#fff; }
  header h1 { margin:0; font-size:1.02rem; font-weight:700; letter-spacing:.2px; }
  header p  { margin:2px 0 0; font-size:.78rem; opacity:.72; }

  main { max-width:720px; margin:0 auto; padding:22px 16px 60px; }

  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.05);
    padding:22px 24px; margin-bottom:16px;
  }
  .card.pad-sm { padding:16px 20px; }

  .meta-grid {
    display:grid; grid-template-columns:auto 1fr; gap:6px 18px;
    font-size:.88rem; margin:0;
  }
  .meta-grid dt { color:var(--muted); font-weight:600; }
  .meta-grid dd { margin:0; font-weight:600; }

  h2.sec {
    font-size:.74rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.6px;
    margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .afspraken-tekst {
    white-space:pre-wrap; font-size:.94rem; line-height:1.75; margin:0;
  }
  .notitie {
    background:#f8faff; border-left:3px solid var(--accent-gold);
    border-radius:6px; padding:12px 16px; white-space:pre-wrap;
    font-size:.9rem; line-height:1.7; margin:0;
  }

  /* Akkoordblok */
  .akk-label { display:block; font-size:.83rem; font-weight:600; margin-bottom:6px; }
  .akk-input {
    width:100%; padding:11px 13px; font-size:.95rem; font-family:inherit;
    border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:var(--text);
  }
  .akk-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,49,81,.10); }
  .akk-check { display:flex; align-items:flex-start; gap:10px; margin:14px 0 16px; font-size:.89rem; cursor:pointer; }
  .akk-check input { width:19px; height:19px; margin:1px 0 0; flex-shrink:0; accent-color:var(--accent); cursor:pointer; }
  .btn {
    width:100%; padding:14px; font-size:.96rem; font-weight:700; font-family:inherit;
    border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer;
  }
  .btn:hover:not(:disabled) { background:#c96300; }
  .btn:disabled { background:#cbd5e1; color:#6b7280; cursor:not-allowed; }

  .bevestigd {
    background:#f0fdf4; border:1px solid #86efac; border-radius:8px;
    padding:16px 18px; display:flex; align-items:flex-start; gap:12px;
  }
  .bevestigd .ic { font-size:1.3rem; line-height:1.2; }
  .bevestigd strong { color:#15803d; display:block; font-size:.92rem; margin-bottom:2px; }
  .bevestigd span { font-size:.84rem; color:#166534; }

  .status-msg { text-align:center; padding:50px 20px; color:var(--muted); font-size:.94rem; }
  .status-msg .big { font-size:2.4rem; display:block; margin-bottom:12px; }
  .status-msg strong { display:block; color:var(--text); font-size:1.02rem; margin-bottom:6px; }

  footer {
    text-align:center; font-size:.75rem; color:var(--muted);
    padding:4px 20px 0; line-height:1.7;
  }

  @media (max-width:560px) {
    header { padding:14px 16px; gap:11px; }
    header img { height:36px; }
    header h1 { font-size:.93rem; }
    main { padding:16px 12px 44px; }
    .card { padding:18px 16px; }
    .meta-grid { grid-template-columns:1fr; gap:2px; }
    .meta-grid dt { margin-top:8px; }
  }
</style>
</head>

// ════════════════════════════════════════════════════════════════════════════
var SUPABASE_URL      = 'https://ucaclxgvwulfacplmdlf.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_cABVGts0OTDqfQLQsYMVqg_5O0Rmp3I';

var supa = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } })
  : null;

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toonStatus(icoon, titel, tekst) {
  document.getElementById('root').innerHTML =
    '<div class="status-msg"><span class="big">' + icoon + '</span>' +
    '<strong>' + esc(titel) + '</strong>' + esc(tekst) + '</div>';
  document.getElementById('foot').innerHTML = '';
}

function getToken() {
  try {
    var t = new URLSearchParams(window.location.search).get('t') || '';
    // Alleen een net UUID accepteren — voorkomt onnodige requests.
    return /^[0-9a-fA-F-]{36}$/.test(t) ? t : '';
  } catch (_) { return ''; }
}

var TOKEN = getToken();
var DATA  = null;

function datumNL(iso) {
  try {
    return new Date(iso).toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
  } catch (_) { return ''; }
}

function render() {
  var d = DATA;
  var regels = '';
  if (d.naam)            regels += '<dt>Naam</dt><dd>' + esc(d.naam) + '</dd>';
  if (d.functie)         regels += '<dt>Functie</dt><dd>' + esc(d.functie) + '</dd>';
  if (d.gesprek_datum)   regels += '<dt>Gesprek op</dt><dd>' + esc(d.gesprek_datum) + '</dd>';
  if (d.gespreksvoerder) regels += '<dt>Gesproken met</dt><dd>' + esc(d.gespreksvoerder) + '</dd>';

  var html = '';

  if (regels) {
    html += '<div class="card pad-sm"><dl class="meta-grid">' + regels + '</dl></div>';
  }

  html += '<div class="card">' +
            '<h2 class="sec">Wat we hebben afgesproken</h2>' +
            '<p class="afspraken-tekst">' + esc(d.afspraken || 'Er zijn geen afspraken vastgelegd.') + '</p>' +
          '</div>';

  if (d.notitie) {
    html += '<div class="card">' +
              '<h2 class="sec">Toelichting</h2>' +
              '<p class="notitie">' + esc(d.notitie) + '</p>' +
            '</div>';
  }

  // Reactieblok — al gereageerd, of nog te beantwoorden. Wie het er niet mee
  // eens is moet dat ook kunnen zeggen; anders blijft het stil en weet de
  // gespreksvoerder niet of er gelezen is.
  if (d.akkoord_op) {
    var nietAkkoord = d.akkoord_keuze === 'niet_akkoord';
    html += '<div class="card pad-sm"><div class="bevestigd"' +
              (nietAkkoord ? ' style="background:#fef2f2;border-color:#fecaca;"' : '') + '>' +
              '<span class="ic">' + (nietAkkoord ? '&#10060;' : '&#9989;') + '</span><div>' +
              '<strong>' + (nietAkkoord ? 'Niet akkoord' : 'Gelezen en akkoord') + '</strong>' +
              '<span>Doorgegeven op ' + esc(datumNL(d.akkoord_op)) +
              (d.akkoord_naam ? ' door ' + esc(d.akkoord_naam) : '') + '</span>' +
              (d.akkoord_toelichting ? '<span>' + esc(d.akkoord_toelichting) + '</span>' : '') +
              '</div></div></div>';
  } else {
    html += '<div class="card" id="akk-card">' +
              '<h2 class="sec">Jouw reactie</h2>' +
              '<label class="akk-label" for="akk-naam">Je naam</label>' +
              '<input class="akk-input" id="akk-naam" type="text" autocomplete="name" ' +
                     'placeholder="Vul je naam in" value="' + esc(d.naam || '') + '">' +
              '<label class="akk-check">' +
                '<input type="checkbox" id="akk-vink">' +
                '<span>Ik heb bovenstaande afspraken gelezen.</span>' +
              '</label>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">' +
                '<button class="btn" id="akk-btn" disabled>Akkoord</button>' +
                '<button class="btn" id="akk-btn-nee" disabled ' +
                        'style="background:#fff;color:#b91c1c;border:1.5px solid #fecaca;">Niet akkoord</button>' +
              '</div>' +
              '<div id="akk-toel-wrap" style="display:none;margin-top:12px;">' +
                '<label class="akk-label" for="akk-toel">Wat klopt er niet?</label>' +
                '<textarea class="akk-input" id="akk-toel" rows="3" ' +
                          'placeholder="Beschrijf kort waar je het niet mee eens bent"></textarea>' +
                '<button class="btn" id="akk-btn-nee-def" ' +
                        'style="background:#b91c1c;margin-top:10px;">Niet akkoord doorgeven</button>' +
              '</div>' +
              '<div id="akk-fout" style="margin-top:10px;font-size:.84rem;color:#b91c1c;"></div>' +
            '</div>';
  }

  document.getElementById('root').innerHTML = html;

  document.getElementById('foot').innerHTML =
    'Deze link is persoonlijk en blijft geldig tot ' + esc(datumNL(d.verloopt_op)) + '.<br>' +
    'Vragen over deze afspraken? Neem contact op met ' +
    esc(d.gespreksvoerder || 'je contactpersoon') + ' bij Brightech.';

  var vink   = document.getElementById('akk-vink');
  var btn    = document.getElementById('akk-btn');
  var btnNee = document.getElementById('akk-btn-nee');
  var btnDef = document.getElementById('akk-btn-nee-def');
  if (vink && btn) {
    vink.addEventListener('change', function () {
      btn.disabled = !vink.checked;
      if (btnNee) btnNee.disabled = !vink.checked;
    });
    btn.addEventListener('click', function () { bevestig('akkoord'); });
  }
  // "Niet akkoord" vraagt eerst om een toelichting; zonder reden heeft de
  // gespreksvoerder er niets aan.
  if (btnNee) {
    btnNee.addEventListener('click', function () {
      document.getElementById('akk-toel-wrap').style.display = 'block';
      document.getElementById('akk-toel').focus();
    });
  }
  if (btnDef) btnDef.addEventListener('click', function () { bevestig('niet_akkoord'); });
}

async function bevestig(keuze) {
  var nee   = keuze === 'niet_akkoord';
  var btn   = document.getElementById(nee ? 'akk-btn-nee-def' : 'akk-btn');
  var naam  = (document.getElementById('akk-naam').value || '').trim();
  var toelEl = document.getElementById('akk-toel');
  var toel  = toelEl ? (toelEl.value || '').trim() : '';
  var fout  = document.getElementById('akk-fout');
  var label = btn.textContent;
  fout.textContent = '';

  if (!naam) {
    fout.textContent = 'Vul je naam in om je reactie door te geven.';
    return;
  }
  if (nee && !toel) {
    fout.textContent = 'Geef kort aan waar je het niet mee eens bent.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Bezig\u2026';

  try {
    var res = await supa.rpc('bevestig_gedeelde_afspraken', {
      p_token: TOKEN, p_naam: naam, p_keuze: nee ? 'niet_akkoord' : 'akkoord',
      p_toelichting: nee ? toel : null
    });
    if (res.error) throw res.error;
    if (res.data === true) {
      DATA.akkoord_op          = new Date().toISOString();
      DATA.akkoord_naam        = naam;
      DATA.akkoord_keuze       = nee ? 'niet_akkoord' : 'akkoord';
      DATA.akkoord_toelichting = nee ? toel : null;
      render();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    } else {
      // false = link verlopen, ingetrokken, of al eerder beantwoord
      laden();
    }
  } catch (e) {
    fout.textContent = 'Doorgeven is niet gelukt. Probeer het later opnieuw.';
    btn.disabled = false;
    btn.textContent = label;
  }
}

async function laden() {
  if (!TOKEN) {
    toonStatus('&#128274;', 'Ongeldige link',
      'Deze link is niet compleet. Scan de QR-code opnieuw of vraag je contactpersoon om een nieuwe link.');
    return;
  }
  if (!supa) {
    toonStatus('&#9888;&#65039;', 'Kan geen verbinding maken',
      'Probeer het over enkele minuten opnieuw.');
    return;
  }

  try {
    var res = await supa.rpc('get_gedeelde_afspraken', { p_token: TOKEN });
    if (res.error) throw res.error;
    var rij = Array.isArray(res.data) ? res.data[0] : res.data;
    if (!rij) {
      toonStatus('&#128274;', 'Deze link is niet (meer) geldig',
        'De afspraken zijn ingetrokken of de link is verlopen. Neem contact op met je contactpersoon bij Brightech voor een nieuwe link.');
      return;
    }
    DATA = rij;
    render();
  } catch (e) {
    toonStatus('&#9888;&#65039;', 'Er ging iets mis',
      'De afspraken konden niet worden opgehaald. Probeer het over enkele minuten opnieuw.');
  }
}

laden();
</script>
</body>
</html>
